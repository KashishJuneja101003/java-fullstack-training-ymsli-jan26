
<h2>Employee Management</h2>
<button (click)="login()">Login</button>

<button (click)="loadEmployees()">Load All Employees</button>
<button (click)="loadEmployee(1)">Load Employee ID 1</button>
<button (click)="loadEmployee(0)">Load Invalid Employee</button>

<hr>

<!-- Error -->
<div *ngIf="error" style="color:red">
  Error: {{ error }}
</div>

<!-- Single employee -->
<div *ngIf="employee">
  <h3>Single Employee</h3>
  <p>ID: {{ employee.id }}</p>
  <p>Name: {{ employee.name }}</p>
  <p>Salary: {{ employee.salary }}</p>
</div>

<!-- Employee list -->
<div *ngIf="employees.length > 0">
  <h3>Employee List</h3>
  <table border="1" cellpadding="5">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Salary</th>
    </tr>
    <tr *ngFor="let emp of employees">
      <td>{{ emp.id }}</td>
      <td>{{ emp.name }}</td>
      <td>{{ emp.salary }}</td>
    </tr>
  </table>
</div>
